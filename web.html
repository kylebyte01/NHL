<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>NHL Goal Light</title>
<link rel="preconnect" href="https://api.fontshare.com" />
<link href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700&display=swap" rel="stylesheet" />
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #171614; --surface: #1c1b19; --surface2: #242320; --border: #2e2d2a;
  --text: #e8e6e0; --muted: #7a7870; --accent: #cc0000; --accent-dim: #8b0000;
  --red: #d44c4c; --green: #4caf50; --yellow: #c9a227; --gold: #e0b43a;
  --radius: 5px; --sidebar-w: 250px; --header-h: 44px;
}
[data-theme="light"] {
  --bg: #f4f3f0; --surface: #ffffff; --surface2: #ebebea;
  --border: #d0cfc9; --text: #1a1916; --muted: #7a7870;
}
[data-theme="light"] .log-wrap { background: #f5f5f5; }
[data-theme="light"] .log-line { color: #2a2a2a; }
[data-theme="light"] #global-tip { background:#fff!important; color:#1a1916!important; border-color:#d0cfc9!important; }

html, body {
  height: 100%; font-family: 'Satoshi', system-ui, sans-serif; font-size: 13px;
  background: var(--bg); color: var(--text); line-height: 1.5;
  -webkit-tap-highlight-color: transparent; -webkit-text-size-adjust: 100%;
}
body.lock { overflow: hidden; }

/* ── Layout (desktop: fixed app shell, inner panes scroll) ── */
.app {
  display: grid; grid-template-rows: var(--header-h) minmax(0, 1fr); grid-template-columns: var(--sidebar-w) minmax(0, 1fr);
  height: 100vh; height: 100dvh; overflow: hidden;
}
header {
  grid-column: 1 / -1; display: flex; align-items: center; gap: 10px; padding: 0 16px;
  background: var(--surface); border-bottom: 1px solid var(--border); position: relative; z-index: 200;
}
.logo { font-weight: 700; font-size: 14px; letter-spacing: -0.2px; white-space: nowrap; }
.logo span { color: var(--accent); }
.header-right { margin-left: auto; display: flex; align-items: center; gap: 8px; }
.save-state { font-size: 11px; color: var(--muted); min-width: 52px; text-align: right; transition: color .2s; }
.save-state.saving { color: var(--yellow); }
.save-state.saved { color: var(--green); }
.save-state.error { color: var(--red); }
.status-pill {
  font-size: 11px; font-weight: 500; padding: 2px 10px; border-radius: 20px; white-space: nowrap;
  background: var(--surface2); border: 1px solid var(--border); color: var(--muted);
  transition: background .2s, color .2s;
}
.status-pill.monitoring { background: #1a3a1e; border-color: #2d6633; color: var(--green); }
.status-pill.warn { border-color: #6b5a10; color: var(--yellow); }
.icon-btn {
  background: none; border: 1px solid var(--border); border-radius: var(--radius); color: var(--muted);
  width: 32px; height: 32px; cursor: pointer; font-size: 15px; display: flex; align-items: center;
  justify-content: center; transition: border-color .15s, color .15s; flex-shrink: 0;
}
.icon-btn:hover { border-color: var(--accent); color: var(--accent); }
#menu-btn { display: none; }

/* ── Sidebar ── */
.sidebar {
  background: var(--surface); border-right: 1px solid var(--border);
  overflow-x: hidden; overflow-y: auto; padding: 12px 0 32px; transition: transform .25s ease;
  overscroll-behavior: contain; -webkit-overflow-scrolling: touch;
}
.sidebar-section { padding: 0 12px; margin-bottom: 14px; }
.section-label {
  font-size: 10px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase;
  color: var(--muted); margin-bottom: 8px; padding: 0 2px;
}
.field { margin-bottom: 7px; }
.field label { display: flex; align-items: center; gap: 4px; font-size: 11px; color: var(--muted); margin-bottom: 3px; }
.field input[type="text"], .field input[type="number"], .field textarea, .field select {
  width: 100%; background: var(--surface2); border: 1px solid var(--border); border-radius: var(--radius);
  color: var(--text); font-family: inherit; font-size: 12px; padding: 4px 8px; outline: none;
  transition: border-color .15s;
}
.field textarea { resize: vertical; }
.field select { cursor: pointer; }
.field input:focus, .field textarea:focus, .field select:focus { border-color: var(--accent); }

.btn {
  display: inline-flex; align-items: center; gap: 5px; font-family: inherit; font-size: 12px; font-weight: 500;
  padding: 6px 13px; border-radius: var(--radius); border: 1px solid var(--border);
  background: var(--surface2); color: var(--text); cursor: pointer;
  transition: background .15s, border-color .15s, color .15s, opacity .15s; touch-action: manipulation;
}
.btn:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
.btn:disabled { opacity: .38; cursor: not-allowed; }
.btn-primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn-primary:hover:not(:disabled) { background: var(--accent-dim); border-color: var(--accent-dim); color: #fff; }
.btn-danger { border-color: var(--red); color: var(--red); }
.btn-danger:hover:not(:disabled) { background: #3a1515; border-color: var(--red); }

.bulb-status {
  margin-top: 6px; display: flex; align-items: center; gap: 6px; padding: 5px 8px; border-radius: var(--radius);
  border: 1px solid var(--border); background: var(--surface2); font-size: 11px; color: var(--muted); min-height: 28px;
}
.bulb-status .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); flex-shrink: 0; }
.bulb-status.connected { border-color: #2d6633; color: var(--green); }
.bulb-status.connected .dot { background: var(--green); }
.bulb-status.disconnected { border-color: #6b2020; color: var(--red); }
.bulb-status.disconnected .dot { background: var(--red); }
.sidebar-note { font-size: 10.5px; color: var(--muted); padding: 0 14px; margin-top: -4px; }

.tip {
  display: inline-flex; align-items: center; justify-content: center; width: 13px; height: 13px; border-radius: 50%;
  background: var(--surface2); border: 1px solid var(--border); color: var(--muted); font-size: 9px; font-weight: 700;
  cursor: default; flex-shrink: 0;
}

/* ── Main ── */
.main { overflow-y: auto; padding: 16px 20px; display: flex; flex-direction: column; gap: 16px; min-height: 0; -webkit-overflow-scrolling: touch; }
.panel { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; flex-shrink: 0; }
.panel.grow { flex: 1 0 auto; display: flex; flex-direction: column; }
.panel-header {
  display: flex; align-items: center; justify-content: space-between; padding: 9px 14px;
  border-bottom: 1px solid var(--border); font-size: 12px; font-weight: 500; gap: 8px;
}
.panel-header-actions { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.panel-header .btn { padding: 4px 10px; font-size: 11px; }

/* ── Games ── */
#game-list { list-style: none; }
.game-row {
  display: flex; align-items: center; gap: 8px; padding: 8px 14px; border-bottom: 1px solid var(--border);
  transition: background .1s; min-width: 0;
}
.game-row:last-child { border-bottom: none; }
.game-row:hover { background: var(--surface2); }
.game-row.primary { box-shadow: inset 3px 0 0 var(--gold); }
.game-row.muted .game-matchup { opacity: .45; text-decoration: line-through; }
.game-row input[type="checkbox"] { accent-color: var(--accent); cursor: pointer; flex-shrink: 0; width: 15px; height: 15px; }
.game-star { color: var(--gold); font-size: 12px; flex-shrink: 0; }
.game-matchup {
  flex: 1; font-size: 12.5px; font-weight: 500; cursor: pointer; min-width: 0;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.game-time { font-size: 11px; color: var(--muted); white-space: nowrap; flex-shrink: 0; }
.game-badge {
  font-size: 10px; font-weight: 700; padding: 1px 6px; border-radius: 3px; letter-spacing: .04em;
  background: var(--surface2); border: 1px solid var(--border); color: var(--muted); white-space: nowrap; flex-shrink: 0;
}
.game-badge.live { background: #1a3a1e; border-color: #2d6633; color: var(--green); }
.game-clock {
  display: none; font-size: 10px; font-weight: 600; color: var(--green); white-space: nowrap; flex-shrink: 0;
  font-family: 'JetBrains Mono', monospace; background: #1a3a1e; border: 1px solid #2d6633; padding: 1px 5px; border-radius: 3px;
}
.game-clock.visible { display: inline-block; }
.game-clock.intermission { color: var(--yellow); background: #2e2a10; border-color: #5a4a10; }
.team-swatches { display: flex; align-items: center; gap: 2px; flex-shrink: 0; }
.swatch { width: 14px; height: 14px; border-radius: 3px; border: 1px solid rgba(255,255,255,.14); flex-shrink: 0; }
.swatch-sep { width: 1px; height: 12px; background: var(--border); margin: 0 3px; flex-shrink: 0; }

.game-delay-wrap { display: flex; align-items: center; gap: 3px; flex-shrink: 0; font-size: 10px; color: var(--muted); }
.game-delay-input {
  width: 46px; background: var(--surface2); border: 1px solid var(--border); border-radius: var(--radius);
  color: var(--text); font-family: inherit; font-size: 11px; padding: 2px 4px; outline: none; text-align: center;
}
.game-delay-input:focus { border-color: var(--accent); }
.game-delay-input.manual { border-color: var(--yellow); }
.games-empty { padding: 20px 14px; color: var(--muted); font-size: 12px; text-align: center; }
.games-hint { padding: 7px 14px; font-size: 11px; color: var(--muted); border-top: 1px solid var(--border); }

/* ── Simulate ── */
.simulate-body { display: flex; align-items: center; gap: 8px; padding: 10px 14px; flex-wrap: wrap; }
.simulate-result { font-size: 11px; min-height: 16px; padding: 0 14px 4px; }
.simulate-result.ok { color: var(--green); }
.simulate-result.err { color: var(--red); }
.sim-style { display: flex; align-items: center; gap: 8px; padding: 0 14px 10px; font-size: 11px; color: var(--muted); min-height: 26px; flex-wrap: wrap; }

/* ── Log ── */
.log-wrap {
  background: #0e0e0c; font-family: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', monospace; font-size: 11.5px;
  height: 380px; overflow-y: auto; padding: 8px 12px; border-bottom: 1px solid var(--border);
  -webkit-overflow-scrolling: touch;
}
.log-line { line-height: 1.6; white-space: pre-wrap; word-break: break-word; }
.log-line.goal { color: var(--accent); font-weight: 600; }
.log-line.error { color: var(--red); }
.log-line.done { color: var(--muted); font-style: italic; }
.log-line.history { color: #555; }
.log-footer { display: flex; align-items: center; gap: 10px; padding: 7px 14px; }
.autoscroll-label { display: flex; align-items: center; gap: 5px; font-size: 11px; color: var(--muted); cursor: pointer; user-select: none; }
.autoscroll-label input { accent-color: var(--accent); }
.log-count { font-size: 10px; color: var(--muted); }
.controls { display: flex; gap: 8px; padding: 12px 14px; border-top: 1px solid var(--border); flex-wrap: wrap; align-items: center; }
.run-hint { font-size: 11px; color: var(--muted); }

.sidebar-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.55); z-index: 149; }
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: var(--muted); }
input[type="number"]::-webkit-inner-spin-button, input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
input[type="number"] { -moz-appearance: textfield; }

/* ── Mobile: the PAGE scrolls (no nested app shell), drawer for settings ── */
@media (max-width: 680px) {
  :root { --header-h: 52px; }
  html, body { height: auto; min-height: 100%; }
  #menu-btn { display: flex; }
  .app { display: block; height: auto; min-height: 100dvh; overflow: visible; }
  header {
    position: sticky; top: 0; height: calc(var(--header-h) + env(safe-area-inset-top));
    padding: env(safe-area-inset-top) 12px 0;
  }
  .save-state { display: none; }
  .sidebar {
    position: fixed; top: 0; left: 0; bottom: 0; width: min(var(--sidebar-w), 86vw); z-index: 150;
    transform: translateX(-110%); padding-top: calc(var(--header-h) + env(safe-area-inset-top) + 8px);
    padding-bottom: calc(40px + env(safe-area-inset-bottom)); box-shadow: 4px 0 24px rgba(0,0,0,.4);
  }
  .sidebar.open { transform: translateX(0); }
  .sidebar-overlay.open { display: block; }
  .main { overflow: visible; padding: 12px 12px calc(24px + env(safe-area-inset-bottom)); gap: 12px; }
  .panel-header { flex-wrap: wrap; }
  .panel-header-actions { width: 100%; justify-content: flex-end; }
  .game-row { padding: 10px; gap: 7px; }
  .game-row input[type="checkbox"] { width: 20px; height: 20px; }
  .team-swatches { display: none; }
  .game-delay-input { width: 52px; padding: 6px 4px; }
  .controls .btn { flex: 1; justify-content: center; }
  .btn { min-height: 38px; }
  .panel-header .btn { min-height: 34px; }
  .log-wrap { height: 280px; }
  /* 16px stops iOS Safari zooming the page when a field is focused */
  input, select, textarea, .field input, .field select, .field textarea, .game-delay-input { font-size: 16px !important; }
  #global-tip { max-width: 220px !important; }
}
@media (max-width: 430px) {
  .game-time, .game-clock { display: none !important; }
}
</style>
</head>
<body>
<div class="app">

  <header>
    <button class="icon-btn" id="menu-btn" title="Settings" aria-label="Toggle settings">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6">
        <line x1="2" y1="4" x2="14" y2="4"/><line x1="2" y1="8" x2="14" y2="8"/><line x1="2" y1="12" x2="14" y2="12"/>
      </svg>
    </button>
    <span class="logo">NHL <span>Goal Light</span></span>
    <div class="header-right">
      <span class="save-state" id="save-state"></span>
      <span class="status-pill" id="status-pill">Idle</span>
      <button class="icon-btn" id="theme-btn" title="Toggle theme" aria-label="Toggle theme">🌙</button>
    </div>
  </header>

  <div class="sidebar-overlay" id="sidebar-overlay"></div>

  <aside class="sidebar" id="sidebar">

    <!-- Bulbs -->
    <div class="sidebar-section">
      <div class="section-label">Bulbs</div>
      <div class="field">
        <label>IP Addresses <span class="tip" data-tip="One IP per line. All bulbs flash together. Saved automatically.">?</span></label>
        <textarea id="bulb-ips" rows="3" placeholder="192.168.x.x&#10;192.168.x.y"></textarea>
      </div>
      <button class="btn" id="test-btn" style="width:100%;justify-content:center">Test Connection</button>
      <div class="bulb-status" id="bulb-status"><div class="dot"></div><span id="bulb-status-text">Not tested</span></div>
    </div>

    <!-- Teams & Delay -->
    <div class="sidebar-section">
      <div class="section-label">Teams &amp; Delay</div>
      <div class="field">
        <label>Primary team <span class="tip" data-tip="Games involving this team use the primary-team delay and are listed first.">?</span></label>
        <select id="primary_team"></select>
      </div>
      <div class="field">
        <label>Primary team delay (s) <span class="tip" data-tip="TV delay for any game involving your primary team.">?</span></label>
        <input type="number" id="primary_delay_seconds" inputmode="decimal" min="0" step="1" />
      </div>
      <div class="field">
        <label>All other teams (s) <span class="tip" data-tip="Default TV delay for every other game. A single game can be overridden in the list.">?</span></label>
        <input type="number" id="default_delay_seconds" inputmode="decimal" min="0" step="1" />
      </div>
    </div>

    <!-- Flash -->
    <div class="sidebar-section">
      <div class="section-label">Flash</div>
      <div class="field"><label>Duration (s) <span class="tip" data-tip="How long the bulb flashes after a goal.">?</span></label><input type="number" id="flash_duration" inputmode="decimal" min="1" step="1" /></div>
      <div class="field"><label>Beat (s) <span class="tip" data-tip="One beat of every team's rhythm. Lower = faster. Colour changes are paced evenly even when the bulb is slow.">?</span></label><input type="number" id="flash_interval" inputmode="decimal" min="0.1" step="0.05" /></div>
      <div class="field"><label>Quiet window (s) <span class="tip" data-tip="After flashing, waits this long for burst goals before restoring.">?</span></label><input type="number" id="flash_quiet_window" inputmode="decimal" min="0" step="0.1" /></div>
      <div class="field"><label>Transition (ms) <span class="tip" data-tip="Fade time between colors. 0 = instant snap.">?</span></label><input type="number" id="flash_transition_ms" inputmode="numeric" min="0" step="10" /></div>
    </div>

    <!-- Polling -->
    <div class="sidebar-section">
      <div class="section-label">Polling</div>
      <div class="field"><label>Live (s) <span class="tip" data-tip="How often the NHL API is polled during a live game.">?</span></label><input type="number" id="poll_live_seconds" inputmode="decimal" min="0.1" step="0.1" /></div>
      <div class="field"><label>Critical (s) <span class="tip" data-tip="Poll interval in the final minute of a period.">?</span></label><input type="number" id="poll_critical_seconds" inputmode="decimal" min="0.1" step="0.05" /></div>
      <div class="field"><label>Pregame (s) <span class="tip" data-tip="Poll interval before puck drop.">?</span></label><input type="number" id="poll_pregame_seconds" inputmode="decimal" min="1" step="1" /></div>
      <div class="field"><label>Error (s) <span class="tip" data-tip="Wait before retrying after a failed request.">?</span></label><input type="number" id="poll_error_seconds" inputmode="decimal" min="1" step="1" /></div>
    </div>

    <!-- Network -->
    <div class="sidebar-section">
      <div class="section-label">Network</div>
      <div class="field"><label>Request timeout (s) <span class="tip" data-tip="Max wait for NHL API response before treating as failed.">?</span></label><input type="number" id="request_timeout" inputmode="decimal" min="1" step="1" /></div>
      <div class="field"><label>Max retries <span class="tip" data-tip="Times to retry a failed NHL API request.">?</span></label><input type="number" id="max_retries" inputmode="numeric" min="0" step="1" /></div>
      <div class="field"><label>Backoff base (s) <span class="tip" data-tip="Starting backoff wait. Doubles each retry up to Backoff max.">?</span></label><input type="number" id="backoff_base" inputmode="decimal" min="0.1" step="0.1" /></div>
      <div class="field"><label>Backoff max (s) <span class="tip" data-tip="Max backoff cap between retries.">?</span></label><input type="number" id="backoff_max" inputmode="decimal" min="1" step="1" /></div>
    </div>

    <!-- Timing -->
    <div class="sidebar-section">
      <div class="section-label">Timing</div>
      <div class="field"><label>Pregame buffer (s) <span class="tip" data-tip="Seconds before puck drop to start polling. 300 = 5 min early.">?</span></label><input type="number" id="pregame_buffer_seconds" inputmode="numeric" min="0" step="30" /></div>
      <div class="field"><label>Restore transition (ms) <span class="tip" data-tip="Fade time back to your original color after a flash.">?</span></label><input type="number" id="restore_transition_ms" inputmode="numeric" min="0" step="10" /></div>
    </div>
    <p class="sidebar-note">Every change is saved and applied instantly.</p>
  </aside>

  <main class="main">

    <div class="panel">
      <div class="panel-header">
        <span>Today's Games</span>
        <div class="panel-header-actions">
          <button class="btn" id="select-all-btn">Track All</button>
          <button class="btn" id="deselect-all-btn">Mute All</button>
          <button class="btn" id="reset-delays-btn" title="Clear per-game delay overrides">Reset delays</button>
          <button class="btn" id="refresh-games-btn">↻ Refresh</button>
        </div>
      </div>
      <ul id="game-list"><li class="games-empty">Loading games…</li></ul>
      <div class="games-hint" id="games-hint"></div>
    </div>

    <div class="panel grow">
      <div class="panel-header">
        <span>Live Log</span>
        <div class="panel-header-actions">
          <span class="log-count" id="log-count"></span>
          <button class="btn" id="clear-log-btn">Clear</button>
        </div>
      </div>
      <div class="log-wrap" id="log-wrap"></div>
      <div class="log-footer">
        <label class="autoscroll-label"><input type="checkbox" id="autoscroll" checked /> Auto-scroll</label>
      </div>
      <div class="controls">
        <button class="btn btn-primary" id="start-btn">▶ Resume</button>
        <button class="btn btn-danger" id="stop-btn">■ Pause</button>
        <span class="run-hint" id="run-hint">Runs automatically — tracks every game, every day.</span>
      </div>
    </div>

    <div class="panel">
      <div class="panel-header"><span>Simulate Goal</span></div>
      <div class="simulate-body">
        <div class="field" style="margin:0;flex:1;min-width:150px">
          <select id="sim-team"><option value="">— Pick a team —</option></select>
        </div>
        <button class="btn btn-primary" id="sim-btn">⚡ Fire</button>
      </div>
      <div class="sim-style" id="sim-style"></div>
      <div class="simulate-result" id="sim-result"></div>
    </div>
  </main>
</div>

<div id="global-tip" style="position:fixed;z-index:9999;background:#111;color:#e8e6e0;border:1px solid #2e2d2a;border-radius:4px;padding:5px 8px;font-size:11px;line-height:1.45;max-width:200px;white-space:pre-wrap;pointer-events:none;opacity:0;transition:opacity .12s;top:0;left:0"></div>

<script>
"use strict";

const $ = id => document.getElementById(id);
const MAX_LOG_LINES = 2000;
const THEME_KEY = "nhl_theme";

/* Sidebar fields that map 1:1 to server settings (id === setting name). */
const NUMBER_FIELDS = [
  "primary_delay_seconds", "default_delay_seconds",
  "flash_duration", "flash_interval", "flash_quiet_window", "flash_transition_ms",
  "poll_live_seconds", "poll_critical_seconds", "poll_pregame_seconds", "poll_error_seconds",
  "request_timeout", "max_retries", "backoff_base", "backoff_max",
  "pregame_buffer_seconds", "restore_transition_ms",
];
const PATTERN_LABELS = {
  "alt": "even alternate", "slow": "slow even", "gallop": "long A · short B", "rev-gallop": "short A · long B",
  "double-tap": "A–A–B tap", "white-tick": "white between colours", "dark-gap": "dark flicker",
  "heartbeat": "two beats + rest", "tri-color": "three-colour cycle", "a-heavy": "mostly A", "b-heavy": "mostly B",
};

const state = {
  games: [],
  muted: new Set(),      // game ids that will NOT flash (everything else is tracked)
  manual: {},            // per-game delay overrides {id: seconds}
  clocks: {},            // cached live-clock text {id: {text, cls}}
  teams: {},             // {abbrev: {name, a, b, c, pattern}}
  enabled: true,
};

const statusPill = $("status-pill"), startBtn = $("start-btn"), stopBtn = $("stop-btn");
const testBtn = $("test-btn"), bulbStatus = $("bulb-status"), bulbStatusTx = $("bulb-status-text");
const logWrap = $("log-wrap"), autoscroll = $("autoscroll"), gameList = $("game-list");
const simTeam = $("sim-team"), simResult = $("sim-result"), primarySel = $("primary_team");
const sidebar = $("sidebar"), overlay = $("sidebar-overlay"), tooltip = $("global-tip");

const num = (id, fallback) => { const v = parseFloat($(id).value); return Number.isFinite(v) ? v : fallback; };
const teamName = a => (state.teams[a] && state.teams[a].name) || a;

/* ── Instant-apply settings ─────────────────────────────────────────────────
   Every edit is queued, debounced, saved to the server (settings.json) and
   pushed straight into the running monitor — nothing to start, stop or apply. */
let _patch = {}, _saveTimer = null, _saveFade = null;

function setSaveState(cls, text) {
  const el = $("save-state"); el.className = "save-state " + cls; el.textContent = text;
  clearTimeout(_saveFade);
  if (cls === "saved") _saveFade = setTimeout(() => { el.textContent = ""; }, 1800);
}
function queueSave(obj, delay = 500) {
  Object.assign(_patch, obj);
  clearTimeout(_saveTimer);
  setSaveState("saving", "Saving…");
  _saveTimer = setTimeout(flushSave, delay);
}
async function flushSave() {
  clearTimeout(_saveTimer);
  if (!Object.keys(_patch).length) return;
  const body = _patch; _patch = {};
  try {
    const r = await fetch("/api/settings", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
    const d = await r.json();
    if (!r.ok) {
      setSaveState("error", "Rejected");
      appendLog(`ERROR: ${d.error || r.status}`, "error");
      await loadSettings();                 // snap fields back to the saved values
    } else {
      setSaveState("saved", "Saved ✓");
      if (d.error) appendLog(`ERROR: ${d.error}`, "error");
    }
  } catch (e) { setSaveState("error", "Offline"); }
  pollStatus();
}

function applySettingsToUi(s) {
  NUMBER_FIELDS.forEach(id => { if (document.activeElement !== $(id) && s[id] !== undefined) $(id).value = s[id]; });
  if (document.activeElement !== $("bulb-ips")) $("bulb-ips").value = (s.bulb_ips || []).join("\n");
  if (s.primary_team && state.teams[s.primary_team]) primarySel.value = s.primary_team;
  state.muted = new Set((s.muted_games || []).map(Number));
  state.manual = {};
  Object.entries(s.game_delays || {}).forEach(([k, v]) => { state.manual[k] = Number(v); });
  state.enabled = s.enabled !== false;
}
async function loadSettings() {
  try {
    const d = await (await fetch("/api/settings")).json();
    applySettingsToUi(d.settings);
    return d.settings;
  } catch (_) { return null; }
}

function attachSettingsHandlers() {
  NUMBER_FIELDS.forEach(id => {
    $(id).addEventListener("input", () => {
      const v = parseFloat($(id).value);
      if (!Number.isFinite(v) || v < 0) return;           // ignore half-typed values
      queueSave({ [id]: v });
      if (id === "primary_delay_seconds" || id === "default_delay_seconds") renderGames();
    });
  });
  primarySel.addEventListener("change", () => { queueSave({ primary_team: primarySel.value }, 150); renderGames(); });
  $("bulb-ips").addEventListener("input", () => queueSave({ bulb_ips: getBulbIps() }, 900));
}

/* ── Drawer / tooltip / theme ───────────────────────────────────────────── */
function setDrawer(open) {
  sidebar.classList.toggle("open", open);
  overlay.classList.toggle("open", open);
  document.body.classList.toggle("lock", open && window.matchMedia("(max-width: 680px)").matches);
}
$("menu-btn").addEventListener("click", () => setDrawer(!sidebar.classList.contains("open")));
overlay.addEventListener("click", () => setDrawer(false));

document.querySelectorAll(".tip").forEach(el => {
  const show = () => {
    tooltip.textContent = el.dataset.tip || "";
    const r = el.getBoundingClientRect();
    if (window.innerWidth - r.right > 212) {
      tooltip.style.top = (r.top + r.height / 2 - 10) + "px"; tooltip.style.left = (r.right + 8) + "px";
    } else {
      tooltip.style.top = (r.bottom + 6) + "px"; tooltip.style.left = Math.max(8, r.left - 40) + "px";
    }
    tooltip.style.opacity = "1";
  };
  const hide = () => { tooltip.style.opacity = "0"; };
  el.addEventListener("mouseenter", show);
  el.addEventListener("mouseleave", hide);
  el.addEventListener("click", e => { e.preventDefault(); show(); setTimeout(hide, 2500); });   // touch devices
});

function setTheme(t) {
  document.documentElement.setAttribute("data-theme", t);
  $("theme-btn").textContent = t === "dark" ? "🌙" : "☀️";
  try { localStorage.setItem(THEME_KEY, t); } catch (_) {}
}
$("theme-btn").addEventListener("click", () =>
  setTheme(document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark"));

/* ── Log ────────────────────────────────────────────────────────────────── */
let _logLines = 0;
function updateLogCount() { $("log-count").textContent = _logLines ? `${_logLines} lines` : ""; }

function classifyLine(line) {
  const u = line.toUpperCase();
  if (line.startsWith("──")) return "done";
  if (u.includes("GOAL")) return "goal";
  if (u.includes("ERROR") || u.includes("EXCEPTION") || u.includes("TRACEBACK")) return "error";
  return "";
}
function appendLog(text, cls = "") {
  const div = document.createElement("div");
  div.className = "log-line" + (cls ? " " + cls : "");
  div.textContent = text;
  logWrap.appendChild(div);
  if (++_logLines > MAX_LOG_LINES) { logWrap.removeChild(logWrap.firstChild); _logLines--; }
  updateLogCount();
  if (autoscroll.checked) logWrap.scrollTop = logWrap.scrollHeight;
}

let _es = null;
function connectLog(since) {
  if (_es) _es.close();
  _es = new EventSource(`/api/log?since=${since}`);     // auto-resumes via Last-Event-ID
  _es.onmessage = e => appendLog(e.data, classifyLine(e.data));
}
async function initLog() {
  let last = 0;
  try {
    const d = await (await fetch("/api/log-history")).json();
    (d.entries || []).forEach(l => appendLog(l, classifyLine(l) || "history"));
    if (d.entries && d.entries.length) appendLog(`── ${d.entries.length} previous log entries loaded ──`, "done");
    last = d.last || 0;
  } catch (_) {}
  connectLog(last);
}
$("clear-log-btn").addEventListener("click", async () => {
  logWrap.innerHTML = ""; _logLines = 0; updateLogCount();
  try { await fetch("/api/clear-log", { method: "POST" }); } catch (_) {}
});

/* ── Bulbs ──────────────────────────────────────────────────────────────── */
const getBulbIps = () => [...new Set($("bulb-ips").value.split(/[\s,;]+/).map(s => s.trim()).filter(Boolean))];
function setBulbStatus(cls, text) { bulbStatus.className = "bulb-status " + cls; bulbStatusTx.textContent = text; }

testBtn.addEventListener("click", async () => {
  const ips = getBulbIps();
  if (!ips.length) { setBulbStatus("disconnected", "Enter at least one IP"); return; }
  testBtn.disabled = true; setBulbStatus("", "Testing…");
  const results = await Promise.all(ips.map(ip =>
    fetch(`/api/test-bulb?ip=${encodeURIComponent(ip)}`).then(r => r.json())
      .catch(e => ({ ok: false, error: e.message }))));
  const ok = results.filter(r => r.ok);
  if (ok.length === ips.length) setBulbStatus("connected", `${ok.length}/${ips.length} connected · ${[...new Set(ok.map(r => r.model))].join(", ")}`);
  else setBulbStatus("disconnected", `${ok.length}/${ips.length} connected · ${(results.find(r => !r.ok) || {}).error || "failed"}`);
  testBtn.disabled = false;
});

/* ── Teams ──────────────────────────────────────────────────────────────── */
function makeSwatch(hex) {
  const el = document.createElement("div");
  el.className = "swatch"; el.style.background = hex;
  return el;
}
function teamSwatches(abbrev) {
  const t = state.teams[abbrev], out = [];
  if (t) { out.push(makeSwatch(t.a), makeSwatch(t.b)); if (t.c) out.push(makeSwatch(t.c)); }
  return out;
}
async function loadTeams() {
  try { state.teams = await (await fetch("/api/team-colors")).json(); } catch (_) { state.teams = {}; }
  const abbrevs = Object.keys(state.teams).sort((a, b) => teamName(a).localeCompare(teamName(b)));
  abbrevs.forEach(a => {
    const label = `${teamName(a)} (${a})`;
    [primarySel, simTeam].forEach(sel => { const o = document.createElement("option"); o.value = a; o.textContent = label; sel.appendChild(o); });
  });
}
simTeam.addEventListener("change", () => {
  const box = $("sim-style"); box.innerHTML = "";
  const t = state.teams[simTeam.value]; if (!t) return;
  teamSwatches(simTeam.value).forEach(s => box.appendChild(s));
  box.appendChild(document.createTextNode(`Rhythm: ${PATTERN_LABELS[t.pattern] || t.pattern}`));
});

/* ── Games ──────────────────────────────────────────────────────────────── */
const isPrimaryGame = g => g.away_abbrev === primarySel.value || g.home_abbrev === primarySel.value;
const defaultDelayFor = g => isPrimaryGame(g) ? num("primary_delay_seconds", 35) : num("default_delay_seconds", 45);
const delayFor = g => (g.id in state.manual) ? state.manual[g.id] : defaultDelayFor(g);
const isLive = s => s === "LIVE" || s === "CRIT";
const isFinal = s => s === "FINAL" || s === "OFF";
const fmtTime = iso => new Date(iso).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });

function updateGamesHint() {
  $("games-hint").textContent =
    `★ ${teamName(primarySel.value)} games use ${num("primary_delay_seconds", 35)}s · all other games ${num("default_delay_seconds", 45)}s. ` +
    `Every game is tracked — untick one to mute it. Edit a delay to override that game (yellow). Changes apply instantly.`;
}

function renderGames() {
  const a = document.activeElement;
  if (a && a.classList && a.classList.contains("game-delay-input")) return;   // don't steal focus mid-typing
  gameList.innerHTML = "";
  updateGamesHint();
  if (!state.games.length) { gameList.innerHTML = '<li class="games-empty">No games scheduled today.</li>'; return; }

  const sorted = [...state.games].sort((x, y) =>
    (isPrimaryGame(y) - isPrimaryGame(x)) || x.start_time_utc.localeCompare(y.start_time_utc));

  sorted.forEach(g => {
    const li = document.createElement("li");
    const muted = state.muted.has(g.id);
    li.className = "game-row" + (isPrimaryGame(g) ? " primary" : "") + (muted ? " muted" : "");

    const cb = document.createElement("input");
    cb.type = "checkbox"; cb.checked = !muted; cb.setAttribute("aria-label", "Track this game");
    cb.addEventListener("change", () => {
      cb.checked ? state.muted.delete(g.id) : state.muted.add(g.id);
      li.classList.toggle("muted", !cb.checked);
      queueSave({ muted_games: [...state.muted] }, 200);
    });

    const matchup = document.createElement("span");
    matchup.className = "game-matchup";
    matchup.textContent = `${g.away_abbrev} @ ${g.home_abbrev}`;
    matchup.title = `${g.away_name} at ${g.home_name}`;
    matchup.addEventListener("click", () => { cb.checked = !cb.checked; cb.dispatchEvent(new Event("change")); });

    const swatches = document.createElement("div");
    swatches.className = "team-swatches";
    teamSwatches(g.away_abbrev).forEach(s => swatches.appendChild(s));
    if (state.teams[g.away_abbrev] && state.teams[g.home_abbrev]) { const sep = document.createElement("div"); sep.className = "swatch-sep"; swatches.appendChild(sep); }
    teamSwatches(g.home_abbrev).forEach(s => swatches.appendChild(s));
    const pa = state.teams[g.away_abbrev], ph = state.teams[g.home_abbrev];
    if (pa && ph) swatches.title = `${g.away_abbrev}: ${PATTERN_LABELS[pa.pattern]} · ${g.home_abbrev}: ${PATTERN_LABELS[ph.pattern]}`;

    const time = document.createElement("span");
    time.className = "game-time"; time.textContent = fmtTime(g.start_time_utc);

    const badge = document.createElement("span");
    badge.className = "game-badge" + (isLive(g.game_state) ? " live" : "");
    badge.textContent = isLive(g.game_state) ? "LIVE" : isFinal(g.game_state) ? "FINAL" : "SOON";

    const clock = document.createElement("span");
    clock.className = "game-clock"; clock.id = `clock-${g.id}`;
    const c = state.clocks[g.id];
    if (c && isLive(g.game_state)) { clock.textContent = c.text; clock.className = "game-clock visible " + c.cls; }

    const wrap = document.createElement("div");
    wrap.className = "game-delay-wrap";
    const inp = document.createElement("input");
    inp.type = "number"; inp.min = "0"; inp.step = "1"; inp.inputMode = "decimal"; inp.className = "game-delay-input";
    inp.value = delayFor(g);
    inp.title = (g.id in state.manual) ? "Custom delay for this game" : "Default delay for this game";
    inp.classList.toggle("manual", g.id in state.manual);
    inp.addEventListener("input", () => {
      const v = parseFloat(inp.value);
      if (Number.isFinite(v) && v >= 0) state.manual[g.id] = v; else delete state.manual[g.id];
      inp.classList.toggle("manual", g.id in state.manual);
      queueSave({ game_delays: state.manual }, 600);
    });
    wrap.append(inp, document.createTextNode("s"));

    li.append(cb);
    if (isPrimaryGame(g)) { const s = document.createElement("span"); s.className = "game-star"; s.textContent = "★"; s.title = "Primary team"; li.append(s); }
    li.append(matchup, swatches, time, badge, clock, wrap);
    gameList.appendChild(li);
  });
}

async function loadGames(force = false) {
  try {
    const r = await fetch("/api/games" + (force ? "?refresh=1" : ""));
    const d = await r.json();
    if (!r.ok) throw new Error(d.error || `HTTP ${r.status}`);
    state.games = d;
    renderGames();
    refreshLiveClocks();
  } catch (e) {
    gameList.innerHTML = "";
    const li = document.createElement("li"); li.className = "games-empty";
    li.textContent = `Could not load games: ${e.message}`; gameList.appendChild(li);
  }
}

async function refreshLiveClocks() {
  const live = state.games.filter(g => isLive(g.game_state));
  await Promise.all(live.map(async g => {
    try {
      const d = await (await fetch(`/api/game-state/${g.id}`)).json();
      const el = $(`clock-${g.id}`);
      if (!d.ok || !el) return;
      if (d.state !== "LIVE" && d.state !== "CRIT") { el.className = "game-clock"; delete state.clocks[g.id]; return; }
      const p = d.period_type === "OT" ? "OT" : d.period_type === "SO" ? "SO" : `P${d.period}`;
      const inter = d.in_intermission;
      const text = inter ? `${p} INT · ${d.away_score}–${d.home_score}` : `${p} ${d.clock || "--:--"} · ${d.away_score}–${d.home_score}`;
      const cls = inter ? "intermission" : "";
      state.clocks[g.id] = { text, cls };
      el.textContent = text; el.className = "game-clock visible " + cls;
    } catch (_) {}
  }));
}

$("select-all-btn").addEventListener("click", () => {
  state.games.forEach(g => state.muted.delete(g.id));
  queueSave({ muted_games: [...state.muted] }, 100); renderGames();
});
$("deselect-all-btn").addEventListener("click", () => {
  state.games.forEach(g => state.muted.add(g.id));
  queueSave({ muted_games: [...state.muted] }, 100); renderGames();
});
$("reset-delays-btn").addEventListener("click", () => {
  state.manual = {}; queueSave({ game_delays: {} }, 100); renderGames();
});
$("refresh-games-btn").addEventListener("click", () => loadGames(true));

/* ── Run state (monitor starts by itself; these just pause/resume) ──────── */
async function pollStatus() {
  try {
    const d = await (await fetch("/api/status")).json();
    state.enabled = d.enabled;
    let text = "Idle", cls = "";
    if (d.state === "monitoring") { text = "Monitoring"; cls = "monitoring"; }
    else if (d.state === "paused") { text = "Paused"; cls = "warn"; }
    else if (!d.has_bulbs) { text = "Add a bulb IP"; cls = "warn"; }
    else { text = "Starting…"; cls = "warn"; }
    statusPill.textContent = text; statusPill.className = "status-pill " + cls;
    startBtn.disabled = d.enabled;
    stopBtn.disabled = !d.enabled;
    $("run-hint").textContent = d.enabled
      ? "Runs automatically — tracks every game, every day."
      : "Paused — no goal lights until you resume.";
  } catch (_) {}
}
startBtn.addEventListener("click", async () => {
  startBtn.disabled = true;
  try {
    const r = await fetch("/api/start", { method: "POST" }); const d = await r.json();
    if (!r.ok) { appendLog(`ERROR: ${d.error || r.status}`, "error"); setDrawer(true); }
  } catch (e) { appendLog(`ERROR: ${e.message}`, "error"); }
  pollStatus();
});
stopBtn.addEventListener("click", async () => {
  stopBtn.disabled = true;
  try { await fetch("/api/stop", { method: "POST" }); } catch (_) {}
  pollStatus();
});

/* ── Simulate ───────────────────────────────────────────────────────────── */
$("sim-btn").addEventListener("click", async () => {
  const team = simTeam.value;
  const show = (cls, text) => { simResult.className = "simulate-result " + cls; simResult.textContent = text; };
  if (!getBulbIps().length) return show("err", "Enter a bulb IP first.");
  if (!team) return show("err", "Pick a team first.");
  $("sim-btn").disabled = true; show("", `Flashing ${team}…`);
  try {
    await flushSave();                                   // use the latest values you typed
    const r = await fetch("/api/simulate-goal", {
      method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ team }),
    });
    const d = await r.json();
    d.ok ? show("ok", "✓ Flash complete.") : show("err", d.error || "Failed.");
  } catch (e) { show("err", e.message); }
  $("sim-btn").disabled = false;
});

/* ── Init ───────────────────────────────────────────────────────────────── */
(async function init() {
  let theme = "dark"; try { theme = localStorage.getItem(THEME_KEY) || "dark"; } catch (_) {}
  setTheme(theme);
  await loadTeams();
  const s = await loadSettings();
  attachSettingsHandlers();

  // one-time migration: pick up bulb IPs saved in this browser by the previous version
  if (s && !(s.bulb_ips || []).length) {
    try {
      const old = JSON.parse(localStorage.getItem("nhl_settings_v3") || localStorage.getItem("nhl_settings_v2") || "null");
      const ips = old && (old["bulb-ips"] || old.bulb_ips);
      if (ips) { $("bulb-ips").value = ips; queueSave({ bulb_ips: getBulbIps() }, 100); }
    } catch (_) {}
  }

  initLog();
  await loadGames();
  pollStatus();
  if (s && !(s.bulb_ips || []).length) setDrawer(true);       // first run: show where to add the bulb
  setInterval(pollStatus, 3000);
  setInterval(() => loadGames(), 60000);
  setInterval(refreshLiveClocks, 30000);
  document.addEventListener("visibilitychange", () => { if (!document.hidden) { loadSettings().then(renderGames); pollStatus(); } });
})();
</script>
</body>
</html>
